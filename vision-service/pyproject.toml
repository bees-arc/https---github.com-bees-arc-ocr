[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-onboarding-vision"
version = "1.0.0"
description = "Internal Vision and Biometric Processing Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.10.0.84",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]
